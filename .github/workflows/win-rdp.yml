name: Auto-Connect Windows Cloud VM
on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: "RDP Password"
        required: true
      ngrok_token:
        description: "Optional Ngrok Token"
        required: false

permissions:
  contents: write

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Agent Script
        uses: actions/checkout@v4

      - name: Boot & Auto-Connect Windows VM
        shell: powershell
        env:
          RDP_PASS: ${{ github.event.inputs.rdp_password }}
          NGROK_TOK: ${{ github.event.inputs.ngrok_token }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: powershell -ExecutionPolicy Bypass -File .\agent.ps1
