name: Windows 10 Classic VM (windows-2022)
on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: "RDP Password"
        required: true
      ngrok_token:
        description: "Optional Ngrok Token"
        required: false

permissions:
  contents: write

concurrency:
  group: wincloud-single-vm
  cancel-in-progress: true

jobs:
  windows-rdp:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout Agent Script
        uses: actions/checkout@v4

      - name: Boot Lightweight Windows 10-gen RDP
        shell: powershell
        env:
          RDP_PASS: ${{ github.event.inputs.rdp_password }}
          NGROK_TOK: ${{ github.event.inputs.ngrok_token }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: powershell -ExecutionPolicy Bypass -File .\agent.ps1
