name: Windows 10 Enterprise LTSC (Real KVM)
on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: "RDP Password"
        required: true
      ngrok_token:
        description: "Optional Ngrok Token"
        required: false

permissions:
  contents: write

concurrency:
  group: wincloud-single-vm
  cancel-in-progress: true

jobs:
  win10-kvm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Scripts
        uses: actions/checkout@v4

      - name: Boot Real Windows 10 LTSC KVM Container
        env:
          RDP_PASS: ${{ github.event.inputs.rdp_password }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash ./kvm-win10.sh
